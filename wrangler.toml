name = "sawstop-finger-save"
main = "src/index.ts"
compatibility_date = "2026-04-10"


[durable_objects]
bindings = [
  { name = "ADMIN_AUTH_LOCK", class_name = "AdminAuthLock" },
  { name = "ADMIN_UPLOAD_COORDINATOR", class_name = "AdminUploadCoordinator" }
]

[[migrations]]
tag = "v1-admin-auth-lock"
new_sqlite_classes = ["AdminAuthLock"]

[[migrations]]
tag = "v2-admin-upload-coordinator"
new_sqlite_classes = ["AdminUploadCoordinator"]

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADVwGf_ZW6nQsPwy"

[[r2_buckets]]
binding = "ATTACHMENT_BUCKET"
bucket_name = "sawstop-attachments"
preview_bucket_name = "sawstop-attachments"
remote = true

[[queues.producers]]
binding = "ATTACHMENT_PROCESSING_QUEUE"
queue = "sawstop-attachment-processing"

[[queues.consumers]]
queue = "sawstop-attachment-processing"
max_batch_size = 1
max_batch_timeout = 1
